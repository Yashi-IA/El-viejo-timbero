name: Actualizar Resultados Reales (El Viejo Timbero)

on:
  workflow_dispatch:
  schedule:
    # Cada 30 min en minutos fuera de pico (:17 y :47) durante la jornada de sorteos AR (10:17 a 23:47 AR)
    - cron: '17,47 13-23 * * *'
    - cron: '17,47 0-2 * * *'

permissions:
  contents: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recuperar último resultados.json desde rama datos (si existe)
        run: |
          if git ls-remote --exit-code --heads origin datos >/dev/null 2>&1; then
            git fetch origin datos:refs/remotes/origin/datos
            git show origin/datos:resultados.json > resultados.json
            echo "Cargado resultados.json previo desde origin/datos."
          else
            echo "Rama datos aún no existe; se parte de main."
          fi

      - name: Instalar dependencias del scraper
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Consultar fuentes oficiales y actualizar resultados.json
        run: npm run actualizar

      - name: Publicar cambios únicamente en rama datos (0 deploys en Netlify)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          HAS_DATOS=false
          if git show-ref --verify --quiet refs/remotes/origin/datos; then
            HAS_DATOS=true
          fi

          if [ "$HAS_DATOS" = true ] && cmp -s <(git show origin/datos:resultados.json) resultados.json; then
            echo "Sin cambios nuevos respecto a origin/datos."
            exit 0
          fi

          TMP_WT=$(mktemp -d)
          if [ "$HAS_DATOS" = true ]; then
            git worktree add -B datos "$TMP_WT" origin/datos
          else
            git worktree add --orphan -b datos "$TMP_WT"
            (cd "$TMP_WT" && git rm -rf . >/dev/null 2>&1 || true)
          fi

          cp resultados.json "$TMP_WT/resultados.json"
          cd "$TMP_WT"
          git add resultados.json

          if git diff --cached --quiet; then
            echo "Sin cambios en resultados.json dentro del worktree."
          else
            git commit -m "chore(datos): actualizar resultados oficiales [skip netlify] [skip ci]"
            git push origin datos
            curl -sS "https://purge.jsdelivr.net/gh/Yashi-IA/El-viejo-timbero@datos/resultados.json" || true
          fi

          cd "$GITHUB_WORKSPACE"
          git worktree remove --force "$TMP_WT"
