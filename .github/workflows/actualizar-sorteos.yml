name: Actualizar Resultados Reales (El Viejo Timbero)

on:
  workflow_dispatch:
  schedule:
    # Horarios en UTC (Argentina es UTC-3)
    - cron: '30 13 * * 1-6'   # 10:30 AR - La Previa
    - cron: '20 15 * * 1-6'   # 12:20 AR - La Primera / El Primero
    - cron: '25 18 * * 0-6'   # 15:25 AR - Matutina + Telekino (dom)
    - cron: '45 20 * * 0'     # 17:45 AR - Telekino escrutinio (dom)
    - cron: '25 21 * * 1-6'   # 18:25 AR - Vespertina
    - cron: '30 0 * * 0-6'    # 21:30 AR - Nocturna, Poceada, Quiniela Plus, Quini 6, Brinco
    - cron: '15 1 * * 0-6'    # 22:15 AR - Escrutinios nocturnos, Quini 6, Brinco, Loto Plus
    - cron: '55 1 * * 0,4'    # 22:55 AR (mié y sáb) - Loto Plus escrutinio + Loto 5 Plus (sáb)
    - cron: '30 2 * * 0,4'    # 23:30 AR (mié y sáb) - Escrutinio tardío Loto Plus / Loto 5 Plus

permissions:
  contents: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Recuperar último resultados.json desde rama datos (si existe)
        run: |
          if git ls-remote --exit-code --heads origin datos >/dev/null 2>&1; then
            git fetch origin datos:refs/remotes/origin/datos
            git show origin/datos:resultados.json > resultados.json
            echo "Cargado resultados.json previo desde origin/datos."
          else
            echo "Rama datos aún no existe; se parte de main."
          fi

      - name: Instalar dependencias del scraper
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Consultar fuentes oficiales y actualizar resultados.json
        run: |
          npm run actualizar 2>&1 | tee /tmp/scraper.log
          node -e '
            const urls = [
              "https://www.tujugada.com.ar/quiniela-nacional.asp",
              "https://www.tujugada.com.ar/quiniela_provincia_buenos_aires.asp",
              "https://www.lanacion.com.ar/loterias/quiniela-nacional/",
              "https://www.notitimba.com/lots/",
              "https://www.loteriadesalta.com/resultados-oficiales/quini-6/"
            ];
            (async () => {
              for (const u of urls) {
                try {
                  const r = await fetch(u, { headers: { "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36" } });
                  const t = await r.text();
                  console.log("DIAG", u, "status=" + r.status, "len=" + t.length, "has26=" + /26\/11\/2026/.test(t));
                  if (u.includes("quiniela-nacional.asp")) {
                    const idx = t.indexOf("26/11/2026");
                    console.log("TUJUGADA_SNIPPET:", t.slice(Math.max(0, idx - 150), idx + 600).replace(/\s+/g, " "));
                  }
                } catch (e) {
                  console.log("DIAG_ERR", u, e.message);
                }
              }
            })();
          ' 2>&1 | tee -a /tmp/scraper.log
          TMP_DBG=$(mktemp -d)
          git worktree add --orphan -b debug-log "$TMP_DBG"
          cp /tmp/scraper.log "$TMP_DBG/scraper.log"
          git -C "$TMP_DBG" config user.name "github-actions[bot]"
          git -C "$TMP_DBG" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$TMP_DBG" add scraper.log
          git -C "$TMP_DBG" commit -m "debug: scraper log"
          git -C "$TMP_DBG" push --force origin debug-log
          git worktree remove --force "$TMP_DBG"

      - name: Publicar cambios únicamente en rama datos (0 deploys en Netlify)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          HAS_DATOS=false
          if git show-ref --verify --quiet refs/remotes/origin/datos; then
            HAS_DATOS=true
          fi

          if [ "$HAS_DATOS" = true ] && cmp -s <(git show origin/datos:resultados.json) resultados.json; then
            echo "Sin cambios nuevos respecto a origin/datos."
            exit 0
          fi

          TMP_WT=$(mktemp -d)
          if [ "$HAS_DATOS" = true ]; then
            git worktree add -B datos "$TMP_WT" origin/datos
          else
            git worktree add --orphan -b datos "$TMP_WT"
            (cd "$TMP_WT" && git rm -rf . >/dev/null 2>&1 || true)
          fi

          cp resultados.json "$TMP_WT/resultados.json"
          cd "$TMP_WT"
          git add resultados.json

          if git diff --cached --quiet; then
            echo "Sin cambios en resultados.json dentro del worktree."
          else
            git commit -m "chore(datos): actualizar resultados oficiales [skip netlify] [skip ci]"
            git push origin datos
            curl -sS "https://purge.jsdelivr.net/gh/Yashi-IA/El-viejo-timbero@datos/resultados.json" || true
          fi

          cd "$GITHUB_WORKSPACE"
          git worktree remove --force "$TMP_WT"
